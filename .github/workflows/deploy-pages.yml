name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 08:00 UTC = 05:00 no horário de Brasília (UTC-3).
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-gh-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build static site and deploy gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build:github-pages

      - name: Publish dist/public to gh-pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin '+refs/heads/gh-pages:refs/remotes/origin/gh-pages'
          deploy_dir="$RUNNER_TEMP/gh-pages"
          git worktree add --detach "$deploy_dir" refs/remotes/origin/gh-pages

          if [ -f "$deploy_dir/CNAME" ]; then
            cp "$deploy_dir/CNAME" dist/public/CNAME
          fi

          find "$deploy_dir" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
          cp -a dist/public/. "$deploy_dir"/

          # Keep Manus development diagnostics and its internal route manifest private.
          rm -rf "$deploy_dir/__manus__"
          rm -f "$deploy_dir/manus-routes.json" "$deploy_dir/.gitkeep"

          git -C "$deploy_dir" config user.name "github-actions[bot]"
          git -C "$deploy_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$deploy_dir" add --all

          if git -C "$deploy_dir" diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi

          git -C "$deploy_dir" commit -m "Deploy GitHub Pages from ${GITHUB_SHA}"

          git -C "$deploy_dir" remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$deploy_dir" push origin HEAD:gh-pages
